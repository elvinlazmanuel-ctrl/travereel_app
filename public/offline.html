<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Travereel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 24px;
      padding: 40px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #FF6B6B 0%, #FF8C42 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }

    h1 {
      color: #1a1a1a;
      font-size: 28px;
      margin-bottom: 12px;
      font-weight: 700;
    }

    p {
      color: #666;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .features {
      background: #f7f7f7;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
    }

    .features h3 {
      color: #1a1a1a;
      font-size: 14px;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #666;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .feature-item:last-child {
      margin-bottom: 0;
    }

    .feature-item .check {
      color: #2EC4B6;
      font-weight: bold;
    }

    button {
      background: linear-gradient(135deg, #FF6B6B 0%, #FF8C42 100%);
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      width: 100%;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 107, 107, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    .status {
      margin-top: 16px;
      font-size: 14px;
      color: #999;
    }

    .status.online {
      color: #2EC4B6;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>
      It looks like you've lost your internet connection. Don't worry - you can still access your cached Travereel content!
    </p>

    <div class="features">
      <h3>What you can do offline:</h3>
      <div class="feature-item">
        <span class="check">✓</span>
        <span>View cached posts and stories</span>
      </div>
      <div class="feature-item">
        <span class="check">✓</span>
        <span>Browse saved itineraries</span>
      </div>
      <div class="feature-item">
        <span class="check">✓</span>
        <span>Read previously loaded content</span>
      </div>
    </div>

    <button onclick="window.location.reload()">
      🔄 Try Again
    </button>

    <div class="status" id="status">
      Checking connection...
    </div>
  </div>

  <script>
    // Check connection status
    function updateStatus() {
      const statusEl = document.getElementById('status')
      if (navigator.onLine) {
        statusEl.textContent = '✅ Connection restored! Reloading...'
        statusEl.className = 'status online'
        setTimeout(() => window.location.reload(), 1500)
      } else {
        statusEl.textContent = '❌ Still offline. Check your connection.'
        statusEl.className = 'status'
      }
    }

    // Listen for connection changes
    window.addEventListener('online', updateStatus)
    window.addEventListener('offline', updateStatus)

    // Initial check
    updateStatus()

    // Auto-retry every 10 seconds
    setInterval(updateStatus, 10000)
  </script>
</body>
</html>
